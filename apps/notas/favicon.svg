<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Deep navy/sapphire) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3d68"/>
      <stop offset="50%" stop-color="#132744"/>
      <stop offset="100%" stop-color="#0a1524"/>
    </linearGradient>
    
    <!-- Warm Gold Trim -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#916c0e"/>
    </linearGradient>

    <!-- Neon Cyan Accent -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Note Document / Scroll Symbol -->
  <g filter="url(#shadow)">
    <!-- Note Page Body -->
    <rect x="14" y="12" width="28" height="38" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Header banner in note -->
    <path d="M14 15a3 3 0 0 1 3-3h22a3 3 0 0 1 3 3v6H14z" fill="url(#bg)"/>
    
    <!-- Note Content Lines -->
    <line x1="19" y1="26" x2="35" y2="26" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="19" y1="31" x2="32" y2="31" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="19" y1="36" x2="37" y2="36" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="19" y1="41" x2="28" y2="41" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Small Neon Cloud / Database Dot Indicator -->
    <circle cx="20" cy="17" r="2" fill="url(#neon)"/>
    <circle cx="26" cy="17" r="1.5" fill="url(#gold)"/>

    <!-- Quill / Pencil Accent -->
    <g transform="translate(32, 28) rotate(-25)">
      <rect x="0" y="0" width="7" height="24" rx="1.5" fill="url(#gold)" stroke="#78350f" stroke-width="0.8"/>
      <polygon points="0,24 7,24 3.5,30" fill="#f8fafc" stroke="#78350f" stroke-width="0.8"/>
      <polygon points="2,27 5,27 3.5,30" fill="#0f172a"/>
    </g>
  </g>
</svg>
